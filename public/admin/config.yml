backend:
  name: github
  repo: ccyo-fang/Firefly  # 例如：CuteLeaf/Firefly
  branch: master                       # 你的仓库默认分支

media_folder: "public/images"        # 图片上传后存放的本地路径
public_folder: "/images"             # 网站前端访问图片的路径

collections:
  - name: "posts"
    label: "博客文章"
    folder: "src/content/posts"
    create: true
    slug: "{{slug}}"  # 这行你已经有了，保留不动
    fields:
      # ====== 新增：URL 别名字段 ======
      - { 
          label: "URL 别名", 
          name: "slug", 
          widget: "string",
          hint: "英文/拼音，例如 ce-shi-bo-ke，最终网址为 /posts/别名/"
        }
      # ==============================
      - { label: "文章标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "published", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "文章描述", name: "description", widget: "text" }
      - { label: "封面图", name: "image", widget: "image", required: false }
      - { label: "标签", name: "tags", widget: "list", default: [] }
      - { label: "分类", name: "category", widget: "string" }
      - { label: "设为草稿", name: "draft", widget: "boolean", default: false }
      - { label: "文章语言", name: "lang", widget: "string", required: false }
      - { label: "正文内容", name: "body", widget: "markdown" }
